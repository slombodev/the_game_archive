<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TGA · The Game Archive</title>
  <meta name="description" content="TGA (The Game Archive) — a home for indie games.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Shared gradients for the glossy category icons -->
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <defs>
      <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".48" stop-color="#dfe9f7"/>
        <stop offset=".52" stop-color="#a9bdd8"/>
        <stop offset="1" stop-color="#eef4ff"/>
      </linearGradient>
    </defs>
  </svg>

  <canvas id="bg" aria-hidden="true"></canvas>

  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">TGA</span>
        <span class="brand-name">The Game Archive</span>
      </div>
      <div class="status">
        <div class="search" id="search">
          <button id="search-btn" class="icon-btn" type="button" aria-label="Search games" aria-expanded="false" aria-controls="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
          </button>
          <div class="search-box glass" id="search-box" hidden>
            <input id="search-input" type="search" placeholder="Search games…" aria-label="Search games" autocomplete="off" spellcheck="false" role="combobox" aria-controls="search-results" aria-expanded="false" aria-autocomplete="list">
            <ul class="search-results" id="search-results" role="listbox" aria-label="Search results" hidden></ul>
          </div>
        </div>
        <button id="mute" class="icon-btn" type="button" aria-pressed="false" aria-label="Mute sounds">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M16 9l6 6M22 9l-6 6"/></svg>
        </button>
        <time id="clock"></time>
      </div>
    </header>

    <main class="xmb" id="xmb">
      <nav class="cats" aria-label="Categories">
        <div class="cat-row" id="cats" role="tablist" aria-orientation="horizontal"></div>
      </nav>
      <ul class="items" id="items" role="listbox" aria-label="Games"></ul>
      <div class="state" id="state" hidden></div>
    </main>

    <footer class="legal-links">
      <span>© 2026 TGA</span>
      <a href="legal.html#terms">Terms</a>
      <a href="legal.html#privacy">Privacy</a>
      <a href="legal.html#refunds">Refunds</a>
      <a href="legal.html#contact">Contact</a>
    </footer>

    <div class="hints" aria-hidden="true">
      <span><kbd>←</kbd><kbd>→</kbd> Category</span>
      <span><kbd>↑</kbd><kbd>↓</kbd> Select</span>
      <span><kbd>Enter</kbd> Open</span>
      <span><kbd>Esc</kbd> Back</span>
    </div>
  </div>

  <section id="detail" class="detail" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden>
    <img class="d-bg" id="d-bg" alt="">
    <div class="d-shade"></div>
    <div class="d-body">
      <button class="d-back icon-btn" id="d-back" type="button" aria-label="Back to library">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="d-grid">
        <div class="d-main glass">
          <img class="d-cover" id="d-cover" alt="">
          <p class="d-genre" id="d-genre"></p>
          <h1 class="d-title" id="d-title"></h1>
          <p class="d-dev" id="d-dev"></p>
          <div class="d-actions">
            <span class="d-price" id="d-price"></span>
            <div id="d-cta"></div>
          </div>
          <p class="d-note" id="d-note"></p>
        </div>
        <div class="d-side">
          <section class="glass d-panel">
            <h2>Synopsis</h2>
            <p id="d-desc"></p>
          </section>
          <section class="glass d-panel">
            <h2>System Requirements</h2>
            <dl class="d-reqs" id="d-reqs"></dl>
          </section>
        </div>
      </div>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="announcer" aria-live="polite"></div>

  <noscript><p class="noscript">TGA needs JavaScript to load the game library.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
